# Nom de l'application
spring.application.name=sirh

# Configuration PostgreSQL
spring.datasource.url=${SIRH_DB_URL:jdbc:postgresql://localhost:5432/sirh}
spring.datasource.username=${SIRH_DB_USERNAME:postgres}
spring.datasource.password=${SIRH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Port de l'application
server.port=8080
sirh.cors.allowed-origins=${SIRH_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
logging.level.root=INFO
logging.level.org.springframework.jdbc.core=INFO
sirh.jwt.secret=${SIRH_JWT_SECRET:local-development-secret-change-this-before-sharing}
sirh.jwt.expiration-minutes=${SIRH_JWT_EXPIRATION_MINUTES:480}
sirh.demo.credentials.enabled=${SIRH_DEMO_CREDENTIALS_ENABLED:false}
